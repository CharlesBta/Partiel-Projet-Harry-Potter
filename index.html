<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="module" src="./js/script.js"></script>
  <title>Charles-Antoine BATTAGLIA - Partiel Harry Potter</title>
</head>

<body>

  <main>
    <header class="header">
      <div class="header__right">
        <img src="./images/logo/logo.png" />
      </div>
      <div class="header__left">
        <h1>Charles-Antoine BATTAGLIA - Wiki Harry Potter</h1>
        <ul>
          <li>MAISON</li>
          <li>SORTS</li>
          <li>CONTACTS</li>
          <li>GALLERIE</li>
        </ul>
        <img src="./images/menu.png" alt="" />
      </div>
    </header>
    <section>
      <h3>HOUSES</h3>
      <div class="houses">
        <div>
          <img src="./images/houses/Gryffindor.png" alt="Gryffindor" />
        </div>
        <div>
          <img src="./images/houses/Hufflepuff.png" alt="Hufflepuff" />
        </div>
        <div>
          <img src="./images/houses/Ravenclaw.png" alt="Ravenclaw" />
        </div>
        <div>
          <img src="./images/houses/Slytherin.png" alt="Slytherin" />
        </div>
      </div>
    </section>
    <section>
      <h3>Characters</h3>
      <input type="search" id="search" class="search" placeholder="Rechercher un personnage..." />
      <div class="filters">
        <button data-sort="name">A-Z</button>
        <button data-sort="age">Par âge</button>
        <button data-alive="true">Vivants</button>
        <button data-alive="false">Décédés</button>
      </div>
      <div class="characters">
        <p>Chargement des personnages...</p>
      </div>
    </section>
  </main>
  <footer>
    <p>Wiki Happy Potter is a FANDOM community</p>
  </footer>
</body>

</html>
